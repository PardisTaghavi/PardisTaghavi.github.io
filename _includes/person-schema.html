{% assign author = site.author %}
{% assign profile_url = site.url | append: "/" %}
{% assign profile_image = author.avatar %}
{% unless profile_image contains '://' %}
  {% assign profile_image = site.url | append: '/' | append: profile_image %}
{% endunless %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ profile_url | jsonify }},
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "name": {{ author.name | jsonify }},
    "url": {{ profile_url | jsonify }},
    "image": {{ profile_image | jsonify }},
    "description": {{ site.description | jsonify }},
    "email": {{ author.email | jsonify }},
    "jobTitle": {{ author.bio | jsonify }},
    "affiliation": {
      "@type": "Organization",
      "name": "Texas A&M University"
    },
    "knowsAbout": [
      "World Models",
      "Generative AI",
      "Autonomous Driving",
      "Video Generation"
    ],
    "sameAs": [
      {%- if author.googlescholar -%}
      {{ author.googlescholar | jsonify }}{%- endif -%}
      {%- if author.github -%}
      {%- if author.googlescholar -%},{%- endif -%}
      {{ "https://github.com/" | append: author.github | jsonify }}
      {%- endif -%}
      {%- if author.linkedin -%}
      {%- if author.googlescholar or author.github -%},{%- endif -%}
      {{ "https://www.linkedin.com/in/" | append: author.linkedin | jsonify }}
      {%- endif -%}
      {%- if author.orcid -%}
      {%- if author.googlescholar or author.github or author.linkedin -%},{%- endif -%}
      {{ author.orcid | jsonify }}
      {%- endif -%}
    ]
  }
}
</script>
